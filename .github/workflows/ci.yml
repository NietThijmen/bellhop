name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: cgo-free build
        env:
          CGO_ENABLED: "0"
        run: go build ./internal/... ./pkg/... ./cmd/bellhopd ./cmd/bellhop ./cmd/bellhop-helper

  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go vet ./...
          go build -trimpath ./internal/... ./pkg/... ./cmd/bellhopd ./cmd/bellhop ./cmd/bellhop-helper
